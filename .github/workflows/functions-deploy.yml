name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions-deploy.yml'
  # PRs deste repositório são mescladas pelo workflow Auto-merge usando o GITHUB_TOKEN
  # padrão, e o GitHub não dispara workflows "on: push" para pushes feitos com esse
  # token (proteção contra loop infinito) — então o gatilho `push` acima nunca roda
  # sozinho depois de um merge. Este `workflow_run` é o mesmo contorno já usado em
  # firebase-deploy.yml para o deploy do Hosting.
  workflow_run:
    workflows: ["Auto-merge"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Em push: sempre roda. Em workflow_run (Auto-merge): só se concluiu com sucesso.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Write service account credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: >
          npx --yes firebase-tools@13 deploy
          --only functions
          --project app-alimentacao-3a23e
          --non-interactive
          --force
