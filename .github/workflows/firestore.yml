name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          # Valida JSON e mostra apenas o client_email (não vaza a chave)
          node -e "const sa=require('$RUNNER_TEMP/sa.json'); console.log('client_email:', sa.client_email); console.log('private_key bytes:', sa.private_key.length);"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} \
            --non-interactive
