name: Auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find open non-draft PR and squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\" and .draft == false) | .number" \
            | head -1)

          if [ -z "$PR" ]; then
            echo "No open non-draft PR found for SHA $HEAD_SHA — nothing to merge."
            exit 0
          fi

          echo "Merging PR #$PR with squash"
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
